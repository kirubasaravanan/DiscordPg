[project]
name = "pgos-ai-engine"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.27",
    "pydantic-settings>=2.6",
    "python-dotenv>=1.0",
    "uvicorn[standard]>=0.32",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
]

[tool.pytest.ini_options]
# Tests live in the top-level tests/ directory (docs/ARCHITECTURE.md §13
# repo mapping), matching every other component's pyproject.toml.
pythonpath = ["."]
testpaths = ["../tests/ai_engine"]
asyncio_mode = "auto"
