[project]
name = "pgos-backend"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.14",
    "argon2-cffi>=23.1",
    "fastapi>=0.115",
    "httpx>=0.27",
    "psycopg[binary]>=3.2",
    "pydantic[email]>=2.9",
    "pydantic-settings>=2.6",
    "pyjwt>=2.9",
    "python-dotenv>=1.0",
    "sqlalchemy>=2.0.36",
    "uvicorn[standard]>=0.32",
    "boto3>=1.35",
    "pgvector>=0.3",
    "apscheduler>=3.10",
]

[dependency-groups]
dev = [
    "moto[s3]>=5.0",
    "pytest>=8.3",
    "pytest-cov>=6.0",
]

[tool.pytest.ini_options]
# Tests live in the top-level tests/ directory (docs/ARCHITECTURE.md §13
# repo mapping), not inside backend/, but they import the `app` package —
# pythonpath makes that resolve when pytest is run from here (backend/).
pythonpath = ["."]
testpaths = ["../tests/backend"]
